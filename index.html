<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Quiz Regalo</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

*{box-sizing:border-box;}

body{
font-family:'Inter',sans-serif;
margin:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#000);
background-size:400% 400%;
animation:gradient 12s ease infinite;
color:white;
}

@keyframes gradient{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.container{
backdrop-filter:blur(20px);
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.15);
padding:40px;
width:90%;
max-width:420px;
border-radius:20px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

/* portada */

.coverImg{
width:80%;
max-width:260px;
margin-bottom:25px;
}

h1{
font-weight:800;
letter-spacing:2px;
font-size:24px;
}

h2{
font-weight:600;
margin-bottom:25px;
}

/* barra progreso */

.progress{
width:100%;
height:6px;
background:rgba(255,255,255,0.2);
border-radius:20px;
margin-bottom:25px;
overflow:hidden;
}

.progressBar{
height:100%;
width:0%;
background:white;
transition:0.4s;
}

/* imagenes respuesta */

.iconTop,
.iconWrong{
width:90%;
max-width:360px;
margin:0 auto 20px auto;
display:none;
}

.drop{animation:drop 0.6s ease;}
@keyframes drop{
0%{transform:translateY(-80px);opacity:0}
100%{transform:translateY(0);opacity:1}
}

.shake{animation:shake 0.5s;}
@keyframes shake{
0%{transform:translateX(0)}
25%{transform:translateX(-8px)}
50%{transform:translateX(8px)}
75%{transform:translateX(-8px)}
100%{transform:translateX(0)}
}

/* input */

input{
width:100%;
padding:14px;
border-radius:10px;
border:none;
background:rgba(255,255,255,0.12);
color:white;
font-size:16px;
outline:none;
}

button{
margin-top:20px;
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:white;
color:black;
font-weight:600;
font-size:16px;
cursor:pointer;
transition:0.25s;
}

button:hover{transform:scale(1.05);}

#resultado{
margin-top:20px;
font-size:18px;
font-weight:600;
}

.correct{color:#4cff6a;}
.incorrect{color:#ff4c4c;}

.hidden{display:none;}

/* animacion regalo */

.giftBox{
width:180px;
margin:20px auto;
animation:bounce 1s infinite alternate;
cursor:pointer;
}

@keyframes bounce{
from{transform:translateY(0)}
to{transform:translateY(-10px)}
}

/* video youtube */

.qr{
width:100%;
max-width:420px;
margin-top:20px;
display:none;
animation:fade 1s ease;
}

.qr iframe{
width:100%;
height:315px;
border-radius:12px;
}

@keyframes fade{
from{opacity:0; transform:scale(0.8)}
to{opacity:1; transform:scale(1)}
}

.finalText{
font-weight:800;
margin-top:20px;
font-size:20px;
}

</style>
</head>

<body>

<div class="container">

<!-- PORTADA -->

<div id="cover">

<img src="cover.png" class="coverImg">

<h1>QUIZ PARA DESBLOQUEAR TU REGALO</h1>

<button onclick="startQuiz()">COMENZAR</button>

</div>

<!-- QUIZ -->

<div id="quiz" class="hidden">

<div class="progress">
<div id="progressBar" class="progressBar"></div>
</div>

<img id="correctIcon" class="iconTop" src="correct.png">
<img id="wrongIcon" class="iconWrong" src="wrong.png">

<h2 id="pregunta"></h2>

<input id="respuesta" placeholder="Escribe tu respuesta">

<button onclick="verificar()">Responder</button>

<div id="resultado"></div>

</div>

<!-- FINAL -->

<div id="final" class="hidden">

<img src="gift.png" class="giftBox" onclick="openGift()">

<div class="finalText">
HAS GANADO! <br>
DISFRUTA DEL PREMIO. <br>
FELIZ CUMPLEAÑOS!
</div>

<div id="videoRegalo" class="qr">

<iframe
src="https://www.youtube.com/embed/rKkz5YmDSdA"
title="Video regalo"
frameborder="0"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
allowfullscreen>
</iframe>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

let preguntas=[

{p:"¿Cuál fue nuestro primer viaje?",r:"paris"},
{p:"¿Cuál es el nombre de nuestro perro tiktoker favorito?",r:"maccaroni"},
{p:"Restaurante en el que comimos sushi por primera vez juntos",r:"sumo"},
{p:"Nombre del baile para desearnos suerte en época de exámenes",r:"gussy"},
{p:"¿En qué calle se encuentra nuestro airbnb favorito de Madrid?",r:"fucar"},
{p:"¿De qué nos disfrazamos en los Carnavales de Ciudad Rodrigo?",r:"pintor"},
{p:"Montaña Rusa del Parque Warner en la que nos montamos 3 veces seguidas",r:"stunt fall"},
{p:"¿De que queríamos vivir en el futuro?",r:"cosecha"},
{p:"¿Cuándo nos hicimos nuestra primera foto juntos?",r:"filomena"},
{p:"¿Cuál es nuestra forma de llamar a los noodles?",r:"woki woki"}

]

let actual=0

function startQuiz(){

document.getElementById("cover").style.display="none"
document.getElementById("quiz").style.display="block"

mostrarPregunta()

}

function mostrarPregunta(){

document.getElementById("pregunta").innerText=preguntas[actual].p
document.getElementById("respuesta").value=""
document.getElementById("resultado").innerText=""

document.getElementById("correctIcon").style.display="none"
document.getElementById("wrongIcon").style.display="none"

let progreso=(actual/preguntas.length)*100
document.getElementById("progressBar").style.width=progreso+"%"

}

function verificar(){

let r=document.getElementById("respuesta").value.toLowerCase()
let correcta=preguntas[actual].r

let resultado=document.getElementById("resultado")
let correctIcon=document.getElementById("correctIcon")
let wrongIcon=document.getElementById("wrongIcon")

correctIcon.style.display="none"
wrongIcon.style.display="none"

if(r===correcta){

resultado.innerText="Correcto 🎉"
resultado.className="correct"

correctIcon.style.display="block"
correctIcon.classList.add("drop")

confetti({
particleCount:200,
spread:120,
origin:{y:0.6}
})

actual++

if(actual<preguntas.length){

setTimeout(mostrarPregunta,5000)

}else{

document.getElementById("quiz").style.display="none"
document.getElementById("final").style.display="block"

confetti({
particleCount:400,
spread:180
})

}

}else{

resultado.innerText="Incorrecto"
resultado.className="incorrect"

wrongIcon.style.display="block"
wrongIcon.classList.add("shake")

}

}

function openGift(){

document.getElementById("videoRegalo").style.display="block"

confetti({
particleCount:500,
spread:200
})

}

</script>

</body>
</html>
